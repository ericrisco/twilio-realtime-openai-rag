[tool.poetry]
name = "eric-twilio-realtime-openai-rag"
version = "0.1.0"
description = "A RAG system using OpenAI, FastAPI, and Twilio for real-time voice interactions"
authors = ["ericrisco@gmail.com"]//-
authors = ["Your Name <your.email@example.com>"]//+
license = "MIT"
readme = "README.md"
package-mode = false//+

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.0"
uvicorn = "^0.23.2"
python-dotenv = "^1.0.0"
aiohttp = "^3.8.6"
aiofiles = "^23.2.1"
pydantic = "^2.4.2"
openai = "^1.3.0"
twilio = "^8.10.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.10.1"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
